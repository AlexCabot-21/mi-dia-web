<!DOCTYPE html>
<html lang="es">
<head>
  <base href="/mi-dia-web/app/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Mi Día: tu dieta, tu entreno y tu compra en un solo sitio.">
  <meta name="theme-color" content="#F4F7F5">

  <!-- Al añadirla a la pantalla de inicio del iPhone se abre como una app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mi Día">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mi Día</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: #F4F7F5; }
    #carga { position: fixed; inset: 0; display: flex; flex-direction: column;
             align-items: center; justify-content: center; gap: 12px;
             font: 600 17px -apple-system, BlinkMacSystemFont, sans-serif; color: #5f6b67; }
    #carga img { width: 96px; height: 96px; border-radius: 22px; }
  </style>
</head>
<body>
  <div id="carga"><img src="icons/Icon-192.png" alt=""><span>Cargando Mi Día…</span></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var c = document.getElementById('carga'); if (c) c.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
